services:
  - type: web
    name: exampilote
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_DATABASE
        value: exampilote
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: MONGODB_URI
        sync: false
      - key: AI_API_KEY
        sync: false
